[report]
api_config = config.ini
query_file = queries/daily_company_report.sql
prompt_file = policies/daily_company_report.md
output_dir = outputs/daily_reports
max_batch_chars = 24000
max_case_chars = 800
max_final_chars = 100000
max_workers = 4

[columns]
id = 출원번호
company = 업체명
date = 등록일
prediction = AI판정
title = 제목
major = 대분류
phenomenon = 현상
action = 조치
reason = 판단근거
error = 에러여부
order = 판정일시
